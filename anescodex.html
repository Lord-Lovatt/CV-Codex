<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="anescodex">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0A1428">
<meta name="format-detection" content="telephone=no">
<title>anescodex · CV-OR codex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A1428;--surface:#0F1B33;--surface-2:#14223F;--surface-3:#1B2B4D;
  --border:rgba(148,163,184,0.12);--border-2:rgba(148,163,184,0.22);--border-3:rgba(148,163,184,0.35);
  --text:#F0F4F8;--text-2:#94A3B8;--text-3:#64748B;--text-4:#475569;
  --accent:#06B6D4;--accent-2:#67E8F9;--accent-bg:rgba(6,182,212,0.10);--accent-border:rgba(6,182,212,0.30);
  --warn:#F59E0B;--warn-2:#FCD34D;--warn-bg:rgba(245,158,11,0.10);--warn-border:rgba(245,158,11,0.30);
  --crit:#DC2626;--crit-2:#FCA5A5;--crit-bg:rgba(220,38,38,0.10);--crit-border:rgba(220,38,38,0.35);
  --ok:#10B981;--ok-2:#6EE7B7;--ok-bg:rgba(16,185,129,0.10);--ok-border:rgba(16,185,129,0.30);
  --info:#3B82F6;--info-bg:rgba(59,130,246,0.10);--info-border:rgba(59,130,246,0.30);
  --vaso:#EF4444;--anti:#F59E0B;--sed:#06B6D4;--para:#A78BFA;--fib:#22C55E;--ind:#3B82F6;--inotr:#EC4899;--vdilat:#14B8A6;
  --sans:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --ease:cubic-bezier(0.32,0.72,0,1);
  --tap:44px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow:hidden;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit;background:none;border:none;outline:none}
button{cursor:pointer;touch-action:manipulation;text-align:left}
a{color:var(--accent);text-decoration:none}
ul,ol{list-style:none}
input{-webkit-appearance:none;appearance:none}
::-webkit-scrollbar{display:none}
*{scrollbar-width:none}

#app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);max-width:520px;margin:0 auto;border-left:0.5px solid var(--border);border-right:0.5px solid var(--border)}
@media (max-width:520px){#app{border:none}}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:calc(var(--safe-top) + 4px);padding-bottom:calc(82px + var(--safe-bot));scroll-behavior:smooth}
.fade-in{animation:viewin .3s var(--ease)}
@keyframes viewin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ========== NAV ========== */
.navbar{position:sticky;top:0;z-index:50;background:rgba(10,20,40,.86);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);padding:8px 16px 12px;display:flex;align-items:center;gap:6px;border-bottom:0.5px solid var(--border)}
.nav-back{width:var(--tap);height:var(--tap);display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:22px;margin-left:-12px;border-radius:10px;transition:background .15s var(--ease)}
.nav-back:active{background:var(--surface-2)}
.nav-title{flex:1;display:flex;flex-direction:column;min-width:0}
.nav-title strong{font-size:16px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-0.2px}
.nav-title small{font-size:11px;color:var(--text-3);margin-top:1px;font-family:var(--mono)}
.nav-action{width:var(--tap);height:var(--tap);display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:20px;border-radius:10px;transition:background .15s var(--ease)}
.nav-action:active{background:var(--surface-2)}
.nav-action.on{color:var(--warn)}

/* ========== HOME HEADER ========== */
.home-hdr{padding:14px 22px 6px}
.home-hdr-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.brand{font-size:26px;font-weight:600;letter-spacing:-0.8px;display:flex;align-items:center;gap:9px}
.brand .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(16,185,129,0.18);animation:pulse 2.4s var(--ease) infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px rgba(16,185,129,0.18)}50%{box-shadow:0 0 0 6px rgba(16,185,129,.04)}}
.brand .ax{color:var(--accent)}
.user-chip{font-size:11px;font-weight:500;color:var(--text-2);background:var(--surface-2);padding:6px 11px;border-radius:100px;border:0.5px solid var(--border-2);letter-spacing:.3px}
.sub{font-size:12px;color:var(--text-3);font-family:var(--mono);letter-spacing:.2px}

/* ========== SEARCH ========== */
.search-trigger{background:var(--surface-2);border:0.5px solid var(--border);border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:11px;margin:14px 22px 18px;font-size:15px;color:var(--text-3);transition:transform .15s var(--ease),background .15s var(--ease);width:calc(100% - 44px)}
.search-trigger:active{transform:scale(.98);background:var(--surface-3)}
.search-trigger i{font-size:18px;color:var(--text-2)}
.search-trigger .kbd{margin-left:auto;font-size:10px;background:rgba(148,163,184,.10);padding:3px 7px;border-radius:5px;border:0.5px solid var(--border-2);font-family:var(--mono);color:var(--text-3)}

/* ========== EMERGENCY TILE ========== */
.em-tile{margin:0 22px 18px;background:linear-gradient(180deg,rgba(220,38,38,.13),rgba(220,38,38,.07));border:0.5px solid var(--crit-border);border-radius:14px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;transition:transform .15s var(--ease);width:calc(100% - 44px)}
.em-tile:active{transform:scale(.98)}
.em-left{display:flex;align-items:center;gap:13px;min-width:0}
.em-icon{width:40px;height:40px;background:var(--crit);border-radius:11px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;flex-shrink:0}
.em-title{font-size:14px;font-weight:600;color:var(--crit-2);letter-spacing:-0.1px}
.em-sub{font-size:11px;color:var(--crit-2);opacity:.8;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.em-arrow{color:var(--crit-2);font-size:20px;flex-shrink:0}

/* ========== SECTION LABELS ========== */
.section-label{font-size:10px;color:var(--text-3);letter-spacing:1.6px;text-transform:uppercase;margin:0 22px 10px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.section-label .count{color:var(--text-3);letter-spacing:.5px;font-weight:400;text-transform:none;font-family:var(--mono);font-size:10px}

/* ========== RECENTS ========== */
.recent{display:flex;gap:8px;padding:0 22px 18px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.recent-pill{flex:0 0 auto;background:var(--surface-2);border:0.5px solid var(--border);border-radius:100px;padding:8px 13px;font-size:12px;color:var(--text);display:flex;align-items:center;gap:7px;font-weight:500;transition:transform .15s var(--ease)}
.recent-pill:active{transform:scale(.95)}
.recent-pill i{font-size:13px;color:var(--accent)}
.recent-empty{font-size:12px;color:var(--text-4);padding:8px 0;font-style:italic}

/* ========== PHASE CHIPS ========== */
.phase-shortcuts{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:0 22px 18px}
.phase-chip{background:var(--surface);border:0.5px solid var(--border);border-radius:12px;padding:12px 13px;display:flex;align-items:center;gap:10px;transition:all .15s var(--ease)}
.phase-chip:active{transform:scale(.97);background:var(--surface-2)}
.phase-chip .ic{width:28px;height:28px;border-radius:8px;background:var(--accent-bg);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.phase-chip .lbl{display:flex;flex-direction:column;min-width:0}
.phase-chip .lbl strong{font-size:12.5px;font-weight:600;color:var(--text)}
.phase-chip .lbl small{font-size:10px;color:var(--text-3);font-family:var(--mono);margin-top:1px}

/* ========== HOME GRID ========== */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;padding:0 22px 22px}
.card{background:var(--surface);border:0.5px solid var(--border);border-radius:14px;padding:14px 13px;min-height:118px;display:flex;flex-direction:column;justify-content:space-between;transition:transform .15s var(--ease),background .15s var(--ease);position:relative}
.card:active{transform:scale(.97);background:var(--surface-2)}
.card-icon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px}
.card-title{font-size:14.5px;font-weight:600;color:var(--text);margin:11px 0 3px;letter-spacing:-0.1px}
.card-meta{font-size:10.5px;color:var(--text-3);font-family:var(--mono);letter-spacing:.1px}
.c-laac .card-icon{background:rgba(20,184,166,.13);color:#14B8A6}
.c-laser .card-icon{background:rgba(244,114,182,.13);color:#F472B6}
.c-lung .card-icon{background:rgba(167,139,250,.13);color:#A78BFA}
.c-tavr .card-icon{background:rgba(34,197,94,.13);color:#22C55E}
.c-opcab .card-icon{background:rgba(245,158,11,.13);color:#F59E0B}
.c-drugs .card-icon{background:rgba(6,182,212,.13);color:#06B6D4}
.c-surgeons .card-icon{background:rgba(168,85,247,.13);color:#A855F7}
.c-setup .card-icon{background:rgba(236,72,153,.13);color:#EC4899}
.c-procedures .card-icon{background:rgba(59,130,246,.13);color:#3B82F6}
.c-bypass .card-icon{background:rgba(239,68,68,.13);color:#EF4444}
.c-srna .card-icon{background:rgba(20,184,166,.13);color:#14B8A6}
.c-account .card-icon{background:rgba(148,163,184,.13);color:#94A3B8}
.c-protocols .card-icon{background:linear-gradient(135deg,rgba(34,197,94,.16),rgba(6,182,212,.16));color:#67E8F9;border:0.5px solid rgba(103,232,249,.25)}

/* ========== LISTS (drugs, surgeons) ========== */
.list-search{padding:10px 22px 12px;position:sticky;top:0;z-index:40;background:rgba(10,20,40,.86);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%)}
.list-input{background:var(--surface-2);border:0.5px solid var(--border);border-radius:11px;padding:11px 14px;display:flex;align-items:center;gap:10px}
.list-input i{color:var(--text-2);font-size:17px}
.list-input input{flex:1;font-size:15px;color:var(--text);min-width:0}
.list-input input::placeholder{color:var(--text-3)}
.list-input .clear{color:var(--text-3);font-size:18px;display:none}
.list-input.has-value .clear{display:block}

.alpha-list{padding:0 22px 14px}
.alpha-group{margin-bottom:10px}
.alpha-letter{font-size:11px;font-weight:700;color:var(--text-3);letter-spacing:1.4px;padding:8px 4px 6px;font-family:var(--mono);border-top:0.5px solid var(--border);margin-top:4px}
.alpha-item{display:flex;align-items:center;gap:12px;padding:12px 4px;border-top:0.5px solid var(--border);min-height:54px;transition:opacity .12s var(--ease)}
.alpha-item:active{opacity:.6}
.alpha-item:first-child{border-top:none}
.alpha-tag{width:4px;height:36px;border-radius:2px;flex-shrink:0}
.alpha-body{flex:1;min-width:0}
.alpha-name{font-size:13.5px;font-weight:600;color:var(--text);letter-spacing:-0.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alpha-sub{font-size:11px;color:var(--text-3);font-family:var(--mono);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alpha-chev{color:var(--text-3);font-size:18px;flex-shrink:0}

/* ========== COLLAPSIBLES ========== */
.collapse{margin:0 22px 10px;border:0.5px solid var(--border);border-radius:13px;background:var(--surface);overflow:hidden;transition:border-color .2s var(--ease)}
.collapse.open{border-color:var(--border-2)}
.collapse-hdr{display:flex;align-items:center;justify-content:space-between;padding:13px 15px;font-size:14px;font-weight:600;min-height:var(--tap);user-select:none;letter-spacing:-0.1px}
.collapse-hdr .left{display:flex;align-items:center;gap:10px}
.collapse-hdr .left .lead{font-size:17px;color:var(--accent)}
.collapse-hdr .count{font-size:10px;color:var(--text-3);font-weight:400;background:var(--surface-2);padding:3px 8px;border-radius:6px;font-family:var(--mono)}
.collapse-hdr .chevron{font-size:18px;color:var(--text-3);margin-left:8px;transition:transform .25s var(--ease)}
.collapse.open .chevron{transform:rotate(180deg)}
.collapse-body{padding:0 15px 14px;display:none}
.collapse.open .collapse-body{display:block;animation:slidein .25s var(--ease)}
@keyframes slidein{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

/* ========== CHECKLIST ========== */
.checklist{display:flex;flex-direction:column}
.check-item{display:flex;align-items:flex-start;gap:11px;padding:11px 0;border-top:0.5px solid var(--border);min-height:48px}
.check-item:first-child{border-top:none;padding-top:6px}
.check-box{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--border-3);flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:1px;transition:all .15s var(--ease)}
.check-item.done .check-box{background:var(--ok);border-color:var(--ok)}
.check-item.done .check-box::after{content:'';width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg);margin-top:-2px}
.check-num{width:22px;height:22px;border-radius:50%;background:var(--surface-2);color:var(--text-2);font-family:var(--mono);font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;border:0.5px solid var(--border-2)}
.check-text{font-size:13px;line-height:1.55;color:var(--text);flex:1}
.check-item.done .check-text{color:var(--text-3);text-decoration:line-through}
.check-text .mono{font-family:var(--mono);font-size:12px;color:var(--accent-2);background:var(--accent-bg);padding:1px 6px;border-radius:5px;border:0.5px solid var(--accent-border);text-decoration:none;display:inline-block;margin:0 2px}
.check-text strong{font-weight:600;color:var(--text)}
.check-text em{font-style:normal;color:var(--accent-2)}

/* ========== CALLOUT ========== */
.callout{margin:0 22px 12px;background:var(--crit-bg);border:0.5px solid var(--crit-border);border-radius:13px;padding:13px 14px}
.callout.warn{background:var(--warn-bg);border-color:var(--warn-border)}
.callout.info{background:var(--info-bg);border-color:var(--info-border)}
.callout.ok{background:var(--ok-bg);border-color:var(--ok-border)}
.callout-title{font-size:11.5px;font-weight:600;color:var(--crit-2);display:flex;align-items:center;gap:8px;margin-bottom:7px;letter-spacing:.4px;text-transform:uppercase}
.callout.warn .callout-title{color:var(--warn-2)}
.callout.info .callout-title{color:var(--accent-2)}
.callout.ok .callout-title{color:var(--ok-2)}
.callout-title i{font-size:15px}
.callout-text{font-size:12.5px;color:var(--crit-2);line-height:1.6;opacity:.95}
.callout.warn .callout-text{color:var(--warn-2)}
.callout.info .callout-text{color:var(--accent-2)}
.callout.ok .callout-text{color:var(--ok-2)}
.callout-text strong{font-weight:600}
.callout-text ul{margin-top:6px;padding-left:16px;list-style:disc}
.callout-text ol{margin-top:6px;padding-left:18px;list-style:decimal}
.callout-text li{margin-bottom:3px}

/* ========== ALERT STRIP ========== */
.alert-strip{margin:14px 22px 16px;background:var(--warn-bg);border-left:3px solid var(--warn);border-radius:10px;padding:11px 13px;display:flex;align-items:flex-start;gap:10px}
.alert-strip.crit{background:var(--crit-bg);border-left-color:var(--crit)}
.alert-strip.info{background:var(--info-bg);border-left-color:var(--info)}
.alert-strip i{color:var(--warn);font-size:17px;flex-shrink:0;margin-top:1px}
.alert-strip.crit i{color:var(--crit)}
.alert-strip.info i{color:var(--info)}
.alert-text{font-size:12.5px;color:var(--warn-2);line-height:1.55;font-weight:500}
.alert-strip.crit .alert-text{color:var(--crit-2)}
.alert-strip.info .alert-text{color:var(--accent-2)}

/* ========== PHASE TABS (protocols) ========== */
.phase-tabs{display:flex;margin:0 22px 14px;background:var(--surface-2);border-radius:11px;padding:3px;border:0.5px solid var(--border);gap:2px;overflow-x:auto}
.phase-tab{flex:1;text-align:center;padding:9px 6px;font-size:11.5px;color:var(--text-2);border-radius:9px;font-weight:500;letter-spacing:.2px;transition:all .2s var(--ease);white-space:nowrap;min-width:fit-content}
.phase-tab.on{background:var(--accent);color:var(--bg);font-weight:600}

/* ========== CHIPS ========== */
.chips{display:flex;gap:6px;padding:0 22px 14px;flex-wrap:wrap}
.chip{font-size:11px;padding:6px 11px;border-radius:100px;background:var(--accent-bg);color:var(--accent-2);border:0.5px solid var(--accent-border);font-family:var(--mono);font-weight:500;letter-spacing:.3px}
.chip.warn{background:var(--warn-bg);color:var(--warn-2);border-color:var(--warn-border)}
.chip.crit{background:var(--crit-bg);color:var(--crit-2);border-color:var(--crit-border)}
.chip.ok{background:var(--ok-bg);color:var(--ok-2);border-color:var(--ok-border)}

/* ========== DRUG DETAIL ========== */
.drug-hero{padding:16px 22px 8px}
.drug-hero h1{font-size:24px;font-weight:600;letter-spacing:-0.5px;line-height:1.15}
.drug-hero .generic{font-size:13px;color:var(--text-2);font-family:var(--mono);margin-top:4px}
.drug-hero .conc{font-size:13px;color:var(--accent-2);font-family:var(--mono);background:var(--accent-bg);border:0.5px solid var(--accent-border);padding:7px 12px;border-radius:8px;margin-top:10px;display:inline-block;max-width:100%;word-break:break-word}
.drug-dose-table{margin:0 22px 14px;background:var(--surface);border:0.5px solid var(--border);border-radius:13px;overflow:hidden}
.drug-dose-row{display:flex;align-items:flex-start;padding:12px 14px;border-top:0.5px solid var(--border);gap:12px;min-height:54px}
.drug-dose-row:first-child{border-top:none}
.drug-dose-row .label{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--text-3);font-weight:600;flex:0 0 100px;padding-top:1px;font-family:var(--mono)}
.drug-dose-row .value{font-size:13.5px;color:var(--text);flex:1;line-height:1.55;font-family:var(--mono);font-weight:500;font-variant-numeric:tabular-nums}

/* ========== SURGEON DETAIL ========== */
.surgeon-hero{padding:14px 22px 10px;display:flex;align-items:center;gap:14px}
.surgeon-avatar{width:54px;height:54px;border-radius:50%;background:var(--surface-3);color:var(--accent-2);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600;border:0.5px solid var(--border-2);font-family:var(--mono);letter-spacing:.5px}
.surgeon-hero h1{font-size:22px;font-weight:600;letter-spacing:-0.4px}
.surgeon-hero .role{font-size:12px;color:var(--text-3);font-family:var(--mono);margin-top:3px}
.surgeon-grid{padding:0 22px 6px}
.surg-row{display:flex;padding:11px 0;border-top:0.5px solid var(--border);gap:14px;align-items:flex-start;min-height:42px}
.surg-row:first-child{border-top:none}
.surg-row .lbl{font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:1.2px;font-weight:600;flex:0 0 110px;padding-top:2px;font-family:var(--mono)}
.surg-row .val{font-size:13px;color:var(--text);flex:1;line-height:1.55}
.surg-row .val.mono{font-family:var(--mono)}

/* ========== TAB BAR ========== */
.tabbar{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;display:flex;justify-content:space-around;padding:6px 4px calc(6px + var(--safe-bot));background:rgba(10,20,40,.92);backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);border-top:0.5px solid var(--border);z-index:100}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;font-size:9.5px;color:var(--text-3);letter-spacing:.3px;border-radius:10px;font-weight:500;transition:color .15s var(--ease);min-height:var(--tap)}
.tab.active{color:var(--accent)}
.tab i{font-size:21px}
.tab:active{background:var(--surface-2)}

/* ========== PROGRESS ========== */
.progress-card{margin:0 22px 14px;background:var(--surface);border:0.5px solid var(--border);border-radius:13px;padding:14px}
.progress-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.progress-hdr h3{font-size:13px;font-weight:600;color:var(--text)}
.progress-hdr .pct{font-size:18px;font-weight:600;color:var(--accent);font-family:var(--mono);font-variant-numeric:tabular-nums}
.progress-bar{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent) 0%,var(--ok) 100%);border-radius:3px;transition:width .35s var(--ease)}

/* ========== TABLES (protocol specs) ========== */
.spec-table{margin:0 22px 14px;background:var(--surface);border:0.5px solid var(--border);border-radius:13px;overflow:hidden}
.spec-row{display:flex;padding:10px 14px;border-top:0.5px solid var(--border);gap:12px;font-size:12.5px;min-height:42px;align-items:flex-start}
.spec-row:first-child{border-top:none}
.spec-row .key{flex:0 0 110px;color:var(--text-3);font-weight:500;font-family:var(--mono);text-transform:uppercase;font-size:10.5px;letter-spacing:1px;padding-top:2px}
.spec-row .val{flex:1;color:var(--text);line-height:1.55;font-size:12.5px}
.spec-row .val .mono{font-family:var(--mono);color:var(--accent-2)}
.spec-row .val strong{font-weight:600}

/* ========== EMPTY ========== */
.empty{text-align:center;padding:48px 22px;color:var(--text-3);font-size:13px}
.empty i{font-size:32px;color:var(--text-4);margin-bottom:10px;display:block}

/* ========== SEARCH RESULTS ========== */
.results{padding:0 22px}
.result{padding:13px 0;border-top:0.5px solid var(--border)}
.result:first-child{border-top:none}
.result:active{opacity:.6}
.result-where{font-size:9.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--text-3);margin-bottom:3px;font-weight:600}
.result-title{font-size:14px;color:var(--text);margin-bottom:3px;font-weight:500}
.result-snippet{font-size:12px;color:var(--text-2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.result-snippet mark{background:var(--accent-bg);color:var(--accent-2);padding:0 3px;border-radius:3px}

/* ========== EM CARDS ========== */
.em-hero{margin:14px 22px 16px;padding:20px 18px;background:linear-gradient(180deg,rgba(220,38,38,.18),rgba(220,38,38,.08));border:0.5px solid var(--crit-border);border-radius:16px;text-align:center}
.em-hero-icon{width:52px;height:52px;background:var(--crit);border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:26px;margin:0 auto 12px}
.em-hero-title{font-size:17px;font-weight:600;color:var(--crit-2);letter-spacing:-0.3px;margin-bottom:4px}
.em-hero-sub{font-size:12px;color:var(--crit-2);opacity:.8;font-family:var(--mono)}
.em-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 22px 14px}
.em-card{background:var(--surface);border:0.5px solid var(--border);border-radius:13px;padding:14px 12px;transition:all .15s var(--ease)}
.em-card:active{transform:scale(.97);background:var(--surface-2);border-color:var(--crit-border)}
.em-card-icon{width:32px;height:32px;border-radius:9px;background:var(--crit-bg);color:var(--crit-2);display:flex;align-items:center;justify-content:center;font-size:17px;margin-bottom:10px}
.em-card-title{font-size:12.5px;font-weight:600;color:var(--text);margin-bottom:3px;letter-spacing:-0.1px}
.em-card-sub{font-size:10.5px;color:var(--text-3);font-family:var(--mono)}

/* ========== FOOTER ========== */
.version-foot{padding:18px 22px 8px;font-size:10px;color:var(--text-4);display:flex;justify-content:space-between;font-family:var(--mono);letter-spacing:.3px}

/* ========== PROCEDURE STEP CARDS ========== */
.step-card{margin:0 22px 10px;background:var(--surface);border:0.5px solid var(--border);border-radius:13px;overflow:hidden;display:block;width:calc(100% - 44px)}
.step-card:active{background:var(--surface-2)}
.step-card-row{display:flex;align-items:center;padding:14px 15px;gap:12px}
.step-num{width:34px;height:34px;border-radius:10px;background:var(--accent-bg);color:var(--accent-2);font-family:var(--mono);font-weight:600;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:0.5px solid var(--accent-border)}
.step-info{flex:1;min-width:0}
.step-info strong{font-size:14px;font-weight:600;display:block;letter-spacing:-0.1px}
.step-info small{font-size:11px;color:var(--text-3);font-family:var(--mono);margin-top:2px;display:block}
.step-chev{color:var(--text-3);font-size:18px;flex-shrink:0}

/* ========== ICONS ========== */
.icon{display:inline-block;width:1em;height:1em;stroke-width:2;stroke:currentColor;fill:none;vertical-align:-2px}
</style>
</head>

const STATE={route:'home',phase:'preop',currentProtocol:null,currentDrug:null,currentSurgeon:null,query:'',procIdx:null};
const KEY={recents:'anescodex.recents',saved:'anescodex.saved',checks:'anescodex.checks',setup:'anescodex.setup',bypass:'anescodex.bypass'};
function load(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch{return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
let RECENTS=load(KEY.recents,[]),SAVED=load(KEY.saved,[]),CHECKS=load(KEY.checks,{}),SETUP_DONE=load(KEY.setup,{}),BYPASS_DONE=load(KEY.bypass,{});

function pushRecent(type,id,label){
  RECENTS=[{type,id,label},...RECENTS.filter(r=>!(r.type===type&&r.id===id))].slice(0,5);
  save(KEY.recents,RECENTS);
}
function toggleSaved(type,id){
  const k=type+':'+id;
  if(SAVED.includes(k))SAVED=SAVED.filter(x=>x!==k);
  else SAVED=[k,...SAVED];
  save(KEY.saved,SAVED);
}
function toggleCheck(k){CHECKS[k]=!CHECKS[k];save(KEY.checks,CHECKS)}
function toggleSetup(k){SETUP_DONE[k]=!SETUP_DONE[k];save(KEY.setup,SETUP_DONE)}
function toggleBypass(k){BYPASS_DONE[k]=!BYPASS_DONE[k];save(KEY.bypass,BYPASS_DONE)}

/* ========== DRUGS ========== */
function renderDrugList(){
  const q=(STATE.query||'').trim().toLowerCase();
  const sorted=[...DRUGS].sort((a,b)=>a.name.localeCompare(b.name));
  const filtered=q?sorted.filter(d=>(d.name+' '+d.generic+' '+d.conc).toLowerCase().includes(q)):sorted;
  const groups={};
  filtered.forEach(d=>{const L=d.name[0].toUpperCase();(groups[L]=groups[L]||[]).push(d)});
  const body=Object.keys(groups).sort().map(L=>{
    return `<div class="alpha-group">
      <div class="alpha-letter">${L}</div>
      ${groups[L].map(d=>{
        const id=d.name.toLowerCase().replace(/\W+/g,'-');
        return `<button class="alpha-item" data-route="drug/${id}" style="width:100%">
          <div class="alpha-tag" style="background:var(--${d.class||'sed'})"></div>
          <div class="alpha-body">
            <div class="alpha-name">${esc(d.name)}</div>
            <div class="alpha-sub">${esc(d.generic)}</div>
          </div>
          <span class="alpha-chev">${ICON.chevR}</span>
        </button>`;
      }).join('')}
    </div>`;
  }).join('');
  root.innerHTML=`
    <div class="fade-in">
      <div class="list-search">
        <div class="list-input ${STATE.query?'has-value':''}">${ICON.search}
          <input id="search-input" type="search" placeholder="Search drug, generic, dose…" autocomplete="off" autocapitalize="none" autocorrect="off" value="${esc(STATE.query)}">
          <span class="clear" data-action="clear">${ICON.x}</span>
        </div>
      </div>
      ${filtered.length?body:`<div class="empty">${ICON.search}<div style="margin-top:8px">No drug matches "${esc(q)}"</div></div>`}
      <div class="version-foot"><span>${DRUGS.length} drugs · always verify pharmacy</span><span>—</span></div>
    </div>`;
  setActiveTab('drugs');
  const inp=document.getElementById('search-input');
  if(inp){inp.addEventListener('input',e=>{STATE.query=e.target.value;renderDrugList()})}
}

function renderProtocol(id){

  const labels={preop:'Pre-op',or:'OR',postop:'Post-op',complications:'Compl.'};
  if(!phaseKeys.includes(STATE.phase))STATE.phase=phaseKeys[0];

  const tabsHtml=phaseKeys.map(k=>`<button class="phase-tab ${STATE.phase===k?'on':''}" data-phase="${k}">${labels[k]}</button>`).join('');

function renderBlock(b,key){
  if(b.type==='callout'){
    return `<div class="callout ${b.variant||''}">
      <div class="callout-title">${ICON.alert}<span>${esc(b.title)}</span></div>
      <div class="callout-text">${b.text}</div>
    </div>`;
  }
  if(b.type==='spec'){
    const rows=b.rows.map(r=>`<div class="spec-row"><div class="key">${esc(r[0])}</div><div class="val">${r[1]}</div></div>`).join('');
    return `<div class="spec-table">${rows}</div>`;
  }
  if(b.type==='collapse'){
    const isOpen=b.open!==false;
    let body='';
    if(b.drugs){
      body=b.drugs.map(d=>`
        <div class="check-item" style="border-top:0.5px solid var(--border)">
          <div style="width:4px;height:34px;border-radius:2px;background:var(--${d.tag});flex-shrink:0;margin-top:1px"></div>
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:600">${esc(d.name)}</div>
            <div style="font-size:11px;color:var(--text-3);font-family:var(--mono);margin-top:2px">${esc(d.sub)}</div>
          </div>
          <span style="font-family:var(--mono);font-size:11.5px;color:var(--accent-2);background:var(--accent-bg);padding:5px 9px;border-radius:7px;border:0.5px solid var(--accent-border);flex-shrink:0;font-weight:500">${esc(d.dose)}</span>
        </div>`).join('');
    } else if(b.items){
      body=`<div class="checklist">${b.items.map((it,i)=>{
        const k=key+'-'+i;
        if(it.type==='check'){
          const done=CHECKS[k];
          return `<div class="check-item ${done?'done':''}" data-check="${k}">
            <div class="check-box"></div>
            <div class="check-text">${it.text}</div>
          </div>`;
        }
        return `<div class="check-item"><div class="check-num">·</div><div class="check-text">${it.text}</div></div>`;
      }).join('')}</div>`;
    }
    const count=b.items?b.items.length:(b.drugs?b.drugs.length:'');
    const unit=b.drugs?'drugs':'items';
    return `<div class="collapse ${isOpen?'open':''}" data-collapse="${key}">
      <div class="collapse-hdr" data-toggle="${key}">
        <div class="left">${b.icon?'<span class="lead">'+ICON[b.icon]+'</span>':''}<span>${esc(b.title)}</span></div>
        <div style="display:flex;align-items:center">
          ${count?`<span class="count">${count} ${unit}</span>`:''}
          <span class="chevron">${ICON.chevD}</span>
        </div>
      </div>
      <div class="collapse-body">${body}</div>
    </div>`;
  }
  return '';
}

/* ========== SEARCH ========== */
function renderSearch(){
  const q=(STATE.query||'').trim().toLowerCase();
  let body='';
  if(q.length<2){body=`<div class="empty">${ICON.search}<div style="margin-top:8px">Type a drug, surgeon, protocol, or step</div></div>`}
  else {
    const hits=[];
    const hl=t=>String(t).replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<mark>$1</mark>');
    DRUGS.forEach(d=>{
      const blob=(d.name+' '+d.generic+' '+d.conc+' '+d.doses.map(r=>r.join(' ')).join(' ')).toLowerCase();
      if(blob.includes(q)){const id=d.name.toLowerCase().replace(/\W+/g,'-');hits.push({where:'DRUG',title:d.name,snippet:d.generic+' · '+d.conc,route:'drug/'+id})}
    });
    SURGEONS.forEach(s=>{
      const blob=(s.name+' '+s.drips+' '+s.misc+' '+s.comms+' '+s.position+' '+s.dislikes).toLowerCase();
      if(blob.includes(q))hits.push({where:'SURGEON',title:'Dr. '+s.name,snippet:s.drips+' · MAP '+s.map,route:'surgeon/'+s.name.toLowerCase()});
    });
    PROTOCOL_ORDER.forEach(id=>{
      const p=PROTOCOLS[id];
      let snippet='';
      const visit=(b)=>{
        if(!b)return;
        if(b.title&&b.title.toLowerCase().includes(q))snippet=snippet||b.title;
        if(b.text&&b.text.toLowerCase().replace(/<[^>]+>/g,'').includes(q))snippet=snippet||b.text.replace(/<[^>]+>/g,'');
        (b.items||[]).forEach(it=>{if(it.text&&it.text.toLowerCase().replace(/<[^>]+>/g,'').includes(q))snippet=snippet||it.text.replace(/<[^>]+>/g,'')});
        (b.drugs||[]).forEach(d=>{if((d.name+' '+d.sub+' '+d.dose).toLowerCase().includes(q))snippet=snippet||(d.name+' — '+d.sub)});
        (b.rows||[]).forEach(r=>{if(r.join(' ').toLowerCase().replace(/<[^>]+>/g,'').includes(q))snippet=snippet||(r[0]+': '+String(r[1]).replace(/<[^>]+>/g,''))});
      };
      Object.values(p.phases).forEach(arr=>arr.forEach(visit));
      const titleHit=(p.title+' '+p.full).toLowerCase().includes(q);
      if(titleHit||snippet)hits.push({where:'PROTOCOL',title:p.full||p.title,snippet:snippet||p.cardSub,route:'protocol/'+id});
    });
    PROCEDURE_STEPS.forEach(s=>{
      const blob=(s.title+' '+s.sub+' '+JSON.stringify(s.content)).toLowerCase().replace(/<[^>]+>/g,'');
      if(blob.includes(q))hits.push({where:'PROCEDURE',title:'Step '+s.n+' · '+s.title,snippet:s.sub,route:'procedure/'+s.n});
    });
    const seen=new Set();
    const dedup=hits.filter(h=>{const k=h.where+h.route;if(seen.has(k))return false;seen.add(k);return true}).slice(0,30);
    body=dedup.length?`<div class="results">${dedup.map(h=>`<div class="result" data-route="${h.route}">
      <div class="result-where">${h.where}</div>
      <div class="result-title">${hl(esc(h.title))}</div>
      <div class="result-snippet">${hl(esc(h.snippet))}</div>
    </div>`).join('')}</div>`:`<div class="empty">${ICON.search}<div style="margin-top:8px">No matches for "${esc(q)}"</div></div>`;
  }
  root.innerHTML=`
    <div class="fade-in">
      <div class="list-search">
        <div class="list-input ${STATE.query?'has-value':''}">${ICON.search}
          <input id="search-input" type="search" placeholder="Drug, surgeon, dose, protocol…" autocomplete="off" autocapitalize="none" autocorrect="off" value="${esc(STATE.query)}">
          <span class="clear" data-action="clear">${ICON.x}</span>
        </div>
      </div>
      ${body}
    </div>`;
  setActiveTab(null);
  const inp=document.getElementById('search-input');
  if(inp){inp.focus();inp.addEventListener('input',e=>{STATE.query=e.target.value;renderSearch()})}
}

/* ========== ROUTER ========== */
function route(path){
  STATE.route=path;
  if(document.querySelector('main'))document.querySelector('main').scrollTop=0;
  if(path==='home')return renderHome();
  if(path==='search')return renderSearch();
  if(path==='drugs'){STATE.query='';return renderDrugList()}
  if(path==='surgeons'){STATE.query='';return renderSurgeonList()}
  if(path==='cases')return renderCasesList();
  if(path==='more')return renderMore();
  if(path==='setup')return renderSetup();
  if(path==='bypass')return renderBypass();
  if(path==='procedures')return renderProcedureList();
  if(path==='emergency')return renderEmergency();
  if(path==='srna')return renderSRNA();
  if(path==='about')return renderAbout();
  if(path.startsWith('drug/'))return renderDrugDetail(path.slice(5));
  if(path.startsWith('surgeon/'))return renderSurgeonDetail(path.slice(8));
  if(path.startsWith('protocol/')){STATE.phase='preop';return renderProtocol(path.slice(9))}
  if(path.startsWith('procedure/'))return renderProcedureDetail(path.slice(10));
  if(path.startsWith('em/'))return renderEmergencyDetail(path.slice(3));
  return renderHome();
}
function go(path){window.location.hash=path}

/* ========== EVENT DELEGATION ========== */
document.addEventListener('click',e=>{
  const rt=e.target.closest('[data-route]');
  if(rt){e.preventDefault();go(rt.dataset.route);return}
  const phaseBtn=e.target.closest('[data-phase]');
  if(phaseBtn){STATE.phase=phaseBtn.dataset.phase;renderProtocol(STATE.route.slice(9));return}
  const toggle=e.target.closest('[data-toggle]');
  if(toggle){const c=toggle.closest('[data-collapse]');if(c)c.classList.toggle('open');return}
  const check=e.target.closest('[data-check]');
  if(check){toggleCheck(check.dataset.check);check.classList.toggle('done');return}
  const setupEl=e.target.closest('[data-setup]');
  if(setupEl){toggleSetup(setupEl.dataset.setup);renderSetup();return}
  const bypassEl=e.target.closest('[data-bypass]');
  if(bypassEl){toggleBypass(bypassEl.dataset.bypass);renderBypass();return}
  const bm=e.target.closest('[data-action="bookmark"]');
  if(bm){toggleSaved(bm.dataset.type,bm.dataset.id);bm.classList.toggle('on');return}
  const clr=e.target.closest('[data-action="clear"]');
  if(clr){STATE.query='';route(STATE.route);return}
  const sr=e.target.closest('[data-action="setup-reset"]');
  if(sr){if(confirm('Reset all setup checklist items?')){SETUP_DONE={};save(KEY.setup,SETUP_DONE);renderSetup()}return}
  const br=e.target.closest('[data-action="bypass-reset"]');
  if(br){if(confirm('Reset bypass init checklist?')){BYPASS_DONE={};save(KEY.bypass,BYPASS_DONE);renderBypass()}return}
});

window.addEventListener('hashchange',()=>{route(window.location.hash.slice(1)||'home')});

/* ========== INIT ========== */
route(window.location.hash.slice(1)||'home');

/* prevent iOS double-tap zoom */
let lastTouch=0;
document.addEventListener('touchend',e=>{const n=Date.now();if(n-lastTouch<=300)e.preventDefault();lastTouch=n},{passive:false});
</script>
